<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1340B0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0D1F8A" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Blue gradient background -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Clipboard body + clip tab — large, bold, white, drop shadow -->
  <g filter="url(#shadow)">
    <rect x="212" y="280" width="600" height="580" rx="56" fill="white"/>
    <rect x="362" y="240" width="300" height="100" rx="30" fill="white"/>
  </g>

  <!-- Tab hole (blue circle punched through the clip) -->
  <circle cx="512" cy="290" r="32" fill="#1E40AF"/>

  <!-- Medical cross — vertical bar -->
  <rect x="468" y="450" width="88" height="280" rx="22" fill="#1E40AF"/>
  <!-- Medical cross — horizontal bar -->
  <rect x="336" y="546" width="352" height="88" rx="22" fill="#1E40AF"/>
</svg>
